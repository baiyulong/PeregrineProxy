server:
  listen:
    - addr: "0.0.0.0:8080"
      protocol: http
    - addr: "0.0.0.0:1080" 
      protocol: socks5

access_control:
  default_action: allow
  rules: []

# Example HTTP proxy with TLS
upstream:
  type: http
  addr: "secure-proxy.example.com:443"
  tls: true
  auth:
    username: myuser
    password: mypass

logging:
  level: info

# Alternative SOCKS5 with TLS example:
# upstream:
#   type: socks5
#   addr: "secure-socks.example.com:443" 
#   tls: true
#   auth:
#     username: socksuser
#     password: sockspass