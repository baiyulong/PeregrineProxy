name: Multi-Platform Build

on:
  push:
    branches:
      - main
      - feat/**
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            binary_suffix: ""

          # Linux ARM64 (aarch64)
          - os: ubuntu-latest
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            binary_suffix: ""

          # macOS x86_64
          - os: macos-12
            arch: x86_64
            target: x86_64-apple-darwin
            binary_suffix: ""

          # macOS ARM64 (Apple Silicon)
          - os: macos-14
            arch: aarch64
            target: aarch64-apple-darwin
            binary_suffix: ""

          # Windows x86_64
          - os: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc
            binary_suffix: ".exe"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-

      - name: Install cross (for ARM64 on Ubuntu)
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'aarch64'
        run: cargo install cross

      - name: Build release (native)
        if: matrix.os != 'ubuntu-latest' || matrix.arch == 'x86_64'
        run: cargo build --verbose --release --target ${{ matrix.target }}

      - name: Build release (cross for ARM64)
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'aarch64'
        run: cross build --verbose --release --target ${{ matrix.target }}

      - name: Prepare artifacts
        id: prepare
        shell: bash
        run: |
          BINARY_NAME="peregrine"
          BINARY_PATH="target/${{ matrix.target }}/release/${BINARY_NAME}${{ matrix.binary_suffix }}"
          ARTIFACT_NAME="${BINARY_NAME}-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}"
          
          echo "binary_path=${BINARY_PATH}" >> $GITHUB_OUTPUT
          echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          
          # Show binary info
          if [ -f "$BINARY_PATH" ]; then
            ls -lh "$BINARY_PATH"
            file "$BINARY_PATH" || true
          fi

      - name: Strip binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: strip "${{ steps.prepare.outputs.binary_path }}" || true

      - name: Create distribution archive
        shell: bash
        run: |
          ARCHIVE_NAME="${{ steps.prepare.outputs.artifact_name }}"
          mkdir -p "dist/${ARCHIVE_NAME}"
          
          # Copy binary
          cp "${{ steps.prepare.outputs.binary_path }}" "dist/${ARCHIVE_NAME}/"
          
          # Copy config and docs
          cp config.example.yaml "dist/${ARCHIVE_NAME}/"
          cp README.md "dist/${ARCHIVE_NAME}/"
          cp LICENSE "dist/${ARCHIVE_NAME}/"
          cp Dockerfile "dist/${ARCHIVE_NAME}/"
          
          # Create archive
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cd dist
            7z a "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}"
            echo "archive=${ARCHIVE_NAME}.zip" >> $GITHUB_ENV
          else
            cd dist
            tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
            echo "archive=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload artifacts to Actions
        uses: actions/upload-artifact@v3
        with:
          name: peregrine-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/${{ env.archive }}
          retention-days: 30

      - name: Upload to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/${{ env.archive }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-

      - name: Run tests
        run: cargo test --verbose --all

      - name: Run clippy
        run: cargo clippy --all --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
